<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="trunk" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <!-- Stylized skill tree — branches with node endpoints -->
  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <path d="M32 58 L32 36" stroke-width="5"/>
    <!-- Main branches -->
    <path d="M32 36 L32 24" stroke-width="4"/>
    <path d="M32 36 L22 26" stroke-width="3.5"/>
    <path d="M32 36 L42 26" stroke-width="3.5"/>
    <!-- Secondary branches left -->
    <path d="M22 26 L14 18" stroke-width="2.5"/>
    <path d="M22 26 L20 16" stroke-width="2.5"/>
    <path d="M14 18 L8 12" stroke-width="2"/>
    <path d="M14 18 L12 10" stroke-width="2"/>
    <!-- Secondary branches right -->
    <path d="M42 26 L50 18" stroke-width="2.5"/>
    <path d="M42 26 L44 16" stroke-width="2.5"/>
    <path d="M50 18 L56 12" stroke-width="2"/>
    <path d="M50 18 L52 10" stroke-width="2"/>
    <!-- Center top branches -->
    <path d="M32 24 L26 14" stroke-width="2.5"/>
    <path d="M32 24 L38 14" stroke-width="2.5"/>
    <path d="M26 14 L22 8" stroke-width="2"/>
    <path d="M38 14 L42 8" stroke-width="2"/>
    <path d="M32 24 L32 12" stroke-width="2"/>
    <path d="M32 12 L30 6" stroke-width="1.5"/>
    <path d="M32 12 L34 6" stroke-width="1.5"/>
  </g>
  <!-- Skill nodes (leaf dots) -->
  <g fill="#10B981">
    <circle cx="8" cy="12" r="2.5" opacity="0.6"/>
    <circle cx="12" cy="10" r="2" opacity="0.5"/>
    <circle cx="20" cy="16" r="2.5" opacity="0.7"/>
    <circle cx="22" cy="8" r="2.5" opacity="0.6"/>
    <circle cx="26" cy="14" r="2" opacity="0.7"/>
    <circle cx="30" cy="6" r="2" opacity="0.5"/>
    <circle cx="34" cy="6" r="2" opacity="0.5"/>
    <circle cx="38" cy="14" r="2" opacity="0.7"/>
    <circle cx="42" cy="8" r="2.5" opacity="0.6"/>
    <circle cx="44" cy="16" r="2.5" opacity="0.7"/>
    <circle cx="52" cy="10" r="2" opacity="0.5"/>
    <circle cx="56" cy="12" r="2.5" opacity="0.6"/>
  </g>
  <!-- Root accent -->
  <path d="M32 58 L28 62 M32 58 L36 62" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
